name: Publish website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-website.yml'
      - 'website/**'
      - 'fonts/variable/**'
      - 'fonts/mono/woff2/**'
      - 'symbols/manifest.json'
      - 'symbols/sprites/**'
      - 'design-system.json'
      - 'OFL.txt'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porto-faifo-pages-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Check website
        working-directory: website
        run: npm run check

      - name: Build static website
        working-directory: website
        run: npm run build

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable in GitHub Actions."
            exit 1
          fi

          npx --yes wrangler@4.168.0 pages deploy website/dist --project-name=porto-faifo --branch=main
